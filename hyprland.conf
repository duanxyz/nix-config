animations {
  bezier=overshot, 0.32, 0.72, 0.38, 1.1
  bezier=linear, 0, 0, 1, 1
  bezier=wind, 0.05, 0.9, 0.1, 1.05
  bezier=winIn, 0.1, 1.1, 0.1, 1.1
  bezier=winOut, 0.3, -0.3, 0, 1
  animation=windows, 1, 4, wind, slide
  animation=windowsIn, 1, 4, winIn, slide
  animation=windowsOut, 1, 4, winOut, slide
  animation=fade, 1, 4, overshot
  animation=workspaces, 1, 4, wind, slidevert
  animation=border, 1, 10, linear
  enabled=true
  workspace_wraparound=true
}

bind= SUPER, RETURN, exec, uwsm-app -- kitty
bind= SUPER, B, exec, uwsm-app -- zen-twilight
bind= SUPER, C, exec, uwsm-app -- windsurf
bind= SUPER, Q, killactive
bind= SUPER, F, fullscreen, 1
bind= SUPER, Space, togglefloating
bind= SUPER, S, togglesplit
bind= SUPER_SHIFT, F, settiled
bind= SUPER, R, exec, hyprctl reload
bind= SUPER_ALT, R, exec, hyprctl --batch "animations:enabled false ; keyword decoration:blur:enabled false"
bind= SUPER, GRAVE, togglespecialworkspace, term
bind= SUPER_SHIFT, GRAVE, movetoworkspace, special:term
bind= SUPER, left, movefocus, l
bind= SUPER, right, movefocus, r
bind= SUPER, up, movefocus, u
bind= SUPER, down, movefocus, d
bind= SUPER, H, movefocus, l
bind= SUPER, L, movefocus, r
bind= SUPER, K, movefocus, u
bind= SUPER, J, movefocus, d
bind= SUPER, 1, workspace, 1
bind= SUPER, 2, workspace, 2
bind= SUPER, 3, workspace, 3
bind= SUPER, period, workspace, +1
bind= SUPER, comma, workspace, -1
bind= SUPER_SHIFT, 1, movetoworkspace, 1
bind= SUPER_SHIFT, 2, movetoworkspace, 2
bind= SUPER_SHIFT, 3, movetoworkspace, 3
bind= SUPER_SHIFT, left, movetoworkspace, l
bind= SUPER_SHIFT, right, movetoworkspace, r
bind= SUPER CTRL, left, movewindow, l
bind= SUPER CTRL, right, movewindow, r
bind= SUPER CTRL, up, movewindow, u
bind= SUPER CTRL, down, movewindow, d
bind= SUPER, Tab, workspace, previous

binde= SUPER_ALT, H, resizeactive, -50 0
binde= SUPER_ALT, L, resizeactive, 50 0
binde= SUPER_ALT, K, resizeactive, 0 -50
binde= SUPER_ALT, J, resizeactive, 0 50
binde= SUPER_ALT, left, resizeactive, -50 0
binde= SUPER_ALT, right, resizeactive, 50 0
binde= SUPER_ALT, up, resizeactive, 0 -50
binde= SUPER_ALT, down, resizeactive, 0 50
binde= SUPER_SHIFT, H, resizeactive, exact 640 480
binde= SUPER_SHIFT, L, resizeactive, exact 854 480
binde= SUPER_SHIFT, K, resizeactive, exact 960 540

bindel=, XF86MonBrightnessUp, exec, brightnessctl set +2%
bindel=, XF86MonBrightnessDown, exec, brightnessctl set 2%-
bindel=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

binds {
  workspace_back_and_forth=true
}

decoration {
  blur {
    brightness=1.1
    contrast=1.2
    enabled=true
    new_optimizations=true
    noise=0.01
    passes=3
    size=6
    vibrancy=0.5
    xray=true
  }

  shadow {
    enabled=true
    range=15
    render_power=3
    scale=1.050000
  }
  rounding=8
}

dwindle {
  force_split=2
  permanent_direction_override=true
  preserve_split=true
  pseudotile=true
  special_scale_factor=0.950000
}



general {
  allow_tearing=false
  border_size=2
  col.active_border=rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border=rgba(595959aa)
  gaps_in=6
  gaps_out=10
  layout=dwindle
  resize_on_border=true
}

gestures {
  workspace_swipe_cancel_ratio=0.200000
  workspace_swipe_distance=500
  workspace_swipe_invert=true
  workspace_swipe_min_speed_to_force=5
}

input {
  touchpad {
    disable_while_typing=true
    drag_lock=true
    natural_scroll=false
    tap-to-click=true
  }
  accel_profile=flat
  follow_mouse=1
  kb_layout=us
  kb_model=
  kb_options=
  kb_rules=
  kb_variant=
  repeat_delay=250
  repeat_rate=35
  sensitivity=0.5
}

master {
  inherit_fullscreen=true
  mfact=0.600000
  orientation=right
}

misc {
  disable_hyprland_logo=true
  enable_swallow=true
  force_default_wallpaper=0
  key_press_enables_dpms=true
  mouse_move_enables_dpms=true
  swallow_regex=^(kitty)$
  vfr=true
  vrr=1
}

windowrulev2=workspace 1, class:^(.*rave-.*|.*zen-.*)$
windowrulev2=workspace 2, class:^(codium|VSCodium|windsurf)$
windowrulev2=workspace 3, class:^(kitty)$
windowrulev2=opacity 0.85 override, class:^(kitty)$
windowrulev2=float, title:^(Picture in picture|Picture-in-Picture)$
windowrulev2=pin, title:^(Picture in picture|Picture-in-Picture)$
windowrulev2=size 25% 25%, title:^(Picture in picture|Picture-in-Picture)$
windowrulev2=move 72% 7%, title:^(Picture in picture|Picture-in-Picture)$
windowrulev2=float, class:^(xdg-desktop-portal-gtk)$
windowrulev2=float, title:^(Save As|Open File|Open Folder|)$
windowrulev2=workspace 1 silent, class:^(.*rave-.*|.*zen-.*)$, onworkspaceclose:1

workspace=special:term, gapsin:0, gapsout:100, border:false, shadow:false, on-created-empty:kill
workspace=special:term, on-created-empty:kitty
workspace=r[2-3], gapsout:50

xwayland {
  force_zero_scaling=true
}
monitor=eDP-1,1920x1080@60,0x0,1
# extra config
source = ~/.config/hypr/extra.conf

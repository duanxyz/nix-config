name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-build:
    name: lint-build (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop .#default --command bash -lc "nix fmt --accept-flake-config && git diff --exit-code"

      - name: Flake checks
        run: nix develop .#default --command bash -lc "nix flake check -L --accept-flake-config --system ${{ matrix.system }}"

      - name: std check
        run: nix develop .#default --command bash -lc "NIX_CONFIG='accept-flake-config = true' std check"

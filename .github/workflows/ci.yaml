name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-build:
    name: lint-build (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux

      # NOTE: Format harus bersih; step ini gagal jika ada diff.
      - name: Check formatting
        run: nix develop .#default --command bash -lc "nix fmt --accept-flake-config && git diff --exit-code"

      - name: Flake checks
        run: nix develop .#default --command bash -lc "nix flake check -L --accept-flake-config --system ${{ matrix.system }}"

      - name: Build home profile
        if: matrix.system == 'x86_64-linux'
        run: nix develop .#default --command bash -lc "nh home build . -c home-semar -- -L"

      - name: Build system profile
        if: matrix.system == 'x86_64-linux'
        run: nix develop .#default --command bash -lc "nh os build . -H nixos-semar -- -L"
